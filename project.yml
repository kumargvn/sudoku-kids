# Xcode project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
name: SudokuKids

options:
  bundleIdPrefix: com.gudivada
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your Apple Team ID. CI passes it in from the APPLE_TEAM_ID secret.
    DEVELOPMENT_TEAM: ""

targets:
  SudokuKids:
    type: application
    platform: iOS
    sources:
      - path: SudokuKids
        excludes:
          - PrivacyInfo.xcprivacy
      - path: SudokuKids/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gudivada.sudokukids
        PRODUCT_NAME: SudokuKids
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Sudoku Kids
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown

  SudokuKidsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SudokuKidsTests
    dependencies:
      - target: SudokuKids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gudivada.sudokukids.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SudokuKids:
    build:
      targets:
        SudokuKids: all
        SudokuKidsTests: [test]
    test:
      config: Debug
      targets:
        - SudokuKidsTests
    archive:
      config: Release
