name: App Review recording

# Run by hand. Builds the real app, boots a simulator, and records its screen
# while a UI test drives the typical flow (resume a saved puzzle, use a hint,
# finish it, see the win screen) — for Apple's "screen recording" request under
# Guideline 2.1. The video is uploaded as a workflow artifact to attach to the
# App Review notes by hand; this workflow never touches App Store Connect.
on:
  workflow_dispatch:

jobs:
  record:
    name: Record App Review demo
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if "Pro Max" in d["name"]))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SudokuKids.xcodeproj \
            -scheme SudokuKids \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build | tail -n 40

      - name: Record the demo UI test
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p fastlane/review
          xcrun simctl io "$UDID" recordVideo --codec h264 fastlane/review/app-review-demo.mov &
          RECORD_PID=$!
          sleep 2
          set -o pipefail
          xcodebuild test-without-building \
            -project SudokuKids.xcodeproj \
            -scheme SudokuKids \
            -destination "id=$UDID" \
            -only-testing:SudokuKidsUITests/SudokuKidsUITests/testRecordAppReviewDemo \
            -derivedDataPath build | tail -n 80
          sleep 1
          kill -INT "$RECORD_PID" 2>/dev/null || true
          wait "$RECORD_PID" 2>/dev/null || true
          ls -la fastlane/review

      - name: Save recording as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-review-demo-video
          path: fastlane/review/app-review-demo.mov

      # Workflow artifacts download from Azure blob storage, which isn't reachable
      # from every environment that drives this repo. Also push the video straight
      # to github.com, on its own orphan branch, so it can be fetched with a plain
      # git clone instead.
      - name: Push recording to the app-review-demo branch
        run: |
          # Move the video out of the repo first: the orphan checkout + clean
          # below wipes all untracked files, including this one.
          cp fastlane/review/app-review-demo.mov "$RUNNER_TEMP/app-review-demo.mov"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan app-review-demo
          git reset --hard
          git clean -fd
          mkdir -p recordings
          cp "$RUNNER_TEMP/app-review-demo.mov" recordings/app-review-demo.mov
          git add recordings/app-review-demo.mov
          git commit -m "App Review demo recording ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -f origin HEAD:app-review-demo
